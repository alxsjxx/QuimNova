name: QuimNova

# Un solo archivo para todo. Cópialo a .github/workflows/ci.yml en tu repositorio.
#  - Subir quimnova.zip a la raíz  -> se desempaqueta solo (job "preparar").
#  - Editar archivos de www/       -> se publica la vista previa web (job "web").
#  - Actions > QuimNova > Run workflow > target=apk -> se genera la APK (job "apk").

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: "Qué ejecutar"
        type: choice
        default: apk
        options: [apk, web]

concurrency:
  group: quimnova
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      desempaquetado: ${{ steps.p.outputs.desempaquetado }}
      listo: ${{ steps.p.outputs.listo }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          desempaquetado=false
          if [ -f quimnova.zip ]; then
            unzip -o quimnova.zip -d .
            rm quimnova.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Desempaquetar proyecto QuimNova"
            git push
            desempaquetado=true
          fi
          listo=false
          [ -f package.json ] && listo=true
          echo "desempaquetado=$desempaquetado" >> "$GITHUB_OUTPUT"
          echo "listo=$listo" >> "$GITHUB_OUTPUT"

  web:
    needs: preparar
    if: >-
      needs.preparar.outputs.listo == 'true' &&
      needs.preparar.outputs.desempaquetado != 'true' &&
      (github.event_name == 'push' || github.event.inputs.target == 'web')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/copy-vendor.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: despliegue
        uses: actions/deploy-pages@v4

  apk:
    needs: preparar
    if: >-
      needs.preparar.outputs.listo == 'true' &&
      needs.preparar.outputs.desempaquetado != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
      - run: npm install --no-audit --no-fund
      - run: node scripts/copy-vendor.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK (debug, firmada con clave de depuración)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk QuimNova.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuimNova-apk
          path: QuimNova.apk
          retention-days: 14
      - name: Publicar en Releases (descarga directa desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" QuimNova.apk \
            --title "QuimNova APK #${{ github.run_number }}" \
            --notes "APK de depuración. Instálala permitiendo 'instalar apps desconocidas' para tu navegador."
